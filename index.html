<title>Calculadora de sexito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. Inputs and operation picker on top, a dark result screen in the middle, history below. */
:root {
  --bg: #eef1f0;
  --surface: #fafbfa;
  --fg: #17201d;
  --muted: #5b6a65;
  --line: #d3dbd8;
  --accent: #0f6b54;
  --accent-fg: #ffffff;
  --err: #b42318;
  --screen: #14211d;
  --screen-fg: #b8f2d4;
  --screen-dim: #6f9a88;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513;
    --surface: #172019;
    --fg: #e6efeb;
    --muted: #93a49e;
    --line: #28352f;
    --accent: #4cc9a0;
    --accent-fg: #08211a;
    --err: #ff8a7a;
    --screen: #0a100e;
    --screen-fg: #b8f2d4;
    --screen-dim: #6f9a88;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513;
  --surface: #172019;
  --fg: #e6efeb;
  --muted: #93a49e;
  --line: #28352f;
  --accent: #4cc9a0;
  --accent-fg: #08211a;
  --err: #ff8a7a;
  --screen: #0a100e;
  --screen-fg: #b8f2d4;
  --screen-dim: #6f9a88;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main {
  max-width: 440px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
h1 {
  font-size: 1.5rem;
  line-height: 1.2;
  margin: 0;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }

form {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label, legend {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  padding: 0;
}
input[type="text"] {
  font-family: var(--font-num);
  font-size: 1.25rem;
  font-variant-numeric: tabular-nums;
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
}
input[type="text"]:focus-visible,
.ops input:focus-visible + span,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
input[aria-invalid="true"] { border-color: var(--err); }

fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ops label { display: block; position: relative; text-transform: none; letter-spacing: 0; }
.ops input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.ops span {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 52px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-num);
  font-size: 1.5rem;
  font-weight: 500;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.ops input:checked + span {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
}
.ops input:not(:checked):hover + span { border-color: var(--accent); }

button.calc {
  font-family: var(--font-ui);
  font-size: 1rem;
  font-weight: 600;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: var(--fg);
  color: var(--bg);
  cursor: pointer;
}
button.calc:hover { opacity: 0.88; }

.screen {
  background: var(--screen);
  color: var(--screen-fg);
  border-radius: 14px;
  padding: 18px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 132px;
}
.screen .kind {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--screen-dim);
}
.screen .expr {
  font-family: var(--font-num);
  font-size: 0.95rem;
  color: var(--screen-dim);
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}
.screen .value {
  font-family: var(--font-num);
  font-size: clamp(1.75rem, 8vw, 2.5rem);
  font-weight: 500;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.screen.error .value {
  font-family: var(--font-ui);
  font-size: 1.15rem;
  font-weight: 600;
  line-height: 1.35;
  color: #ffb4a8;
}
.hint { min-height: 1.2em; margin: 0; font-size: 0.85rem; color: var(--err); }

.history h2 {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 8px;
}
.history ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.history li {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  font-family: var(--font-num);
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
}
.history li span { min-width: 0; overflow-wrap: anywhere; }
.history li .res { font-weight: 600; text-align: right; }
.history .empty { color: var(--muted); font-size: 0.9rem; margin: 0; padding-top: 10px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header>
    <h1>Calculadora de sexito</h1>
    <p class="sub">Escribe dos números, elige la operación y calcula.</p>
  </header>

  <form id="form" novalidate>
    <div class="field">
      <label for="n1">Primer número</label>
      <input id="n1" type="text" inputmode="decimal" autocomplete="off" value="12">
    </div>
    <div class="field">
      <label for="n2">Segundo número</label>
      <input id="n2" type="text" inputmode="decimal" autocomplete="off" value="4">
    </div>
    <fieldset>
      <legend>Operación</legend>
      <div class="ops" role="radiogroup" aria-label="Operación">
        <label><input type="radio" name="op" value="+"><span aria-label="Suma">+</span></label>
        <label><input type="radio" name="op" value="-"><span aria-label="Resta">−</span></label>
        <label><input type="radio" name="op" value="*"><span aria-label="Multiplicación">×</span></label>
        <label><input type="radio" name="op" value="/" checked><span aria-label="División">÷</span></label>
      </div>
    </fieldset>
    <p class="hint" id="hint" role="alert"></p>
    <button class="calc" type="submit">Calcular</button>
  </form>

  <section class="screen" id="screen" aria-live="polite">
    <div class="kind" id="kind"></div>
    <div class="expr" id="expr"></div>
    <div class="value" id="value"></div>
  </section>

  <section class="history">
    <h2>Historial</h2>
    <ol id="list"></ol>
    <p class="empty" id="empty">Las operaciones que calcules aparecerán aquí.</p>
  </section>
</main>

<script>
(function () {
  var NAMES = { "+": "la suma", "-": "la resta", "*": "la multiplicación", "/": "la división" };
  var SYMS = { "+": "+", "-": "−", "*": "×", "/": "÷" };
  var $ = function (id) { return document.getElementById(id); };
  var history = [];

  function parse(text) {
    var t = String(text).trim().replace(",", ".");
    if (t === "" || !/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN;
    return parseFloat(t);
  }
  function fmt(n) {
    return n.toLocaleString("es-PA", { maximumFractionDigits: 10 });
  }

  function compute(add) {
    var a = parse($("n1").value);
    var b = parse($("n2").value);
    var op = document.querySelector('input[name="op"]:checked').value;
    var hint = $("hint");
    $("n1").setAttribute("aria-invalid", isNaN(a));
    $("n2").setAttribute("aria-invalid", isNaN(b));
    if (isNaN(a) || isNaN(b)) {
      hint.textContent = "Escribe un número válido en " + (isNaN(a) && isNaN(b) ? "los dos campos." : isNaN(a) ? "el primer campo." : "el segundo campo.");
      return;
    }
    hint.textContent = "";
    var screen = $("screen");
    $("kind").textContent = "Resultado de " + NAMES[op];
    $("expr").textContent = fmt(a) + " " + SYMS[op] + " " + fmt(b);
    if (op === "/" && b === 0) {
      screen.classList.add("error");
      $("value").textContent = "Error: No se puede dividir entre cero.";
      return;
    }
    screen.classList.remove("error");
    var r = op === "+" ? a + b : op === "-" ? a - b : op === "*" ? a * b : a / b;
    $("value").textContent = fmt(r);
    if (add) {
      history.unshift({ e: fmt(a) + " " + SYMS[op] + " " + fmt(b), r: fmt(r) });
      history = history.slice(0, 8);
      render();
    }
  }

  function render() {
    var ol = $("list");
    ol.innerHTML = "";
    history.forEach(function (h) {
      var li = document.createElement("li");
      var l = document.createElement("span");
      var r = document.createElement("span");
      l.textContent = h.e;
      r.className = "res";
      r.textContent = "= " + h.r;
      li.appendChild(l);
      li.appendChild(r);
      ol.appendChild(li);
    });
    $("empty").hidden = history.length > 0;
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    compute(true);
  });
  compute(false);
  render();
})();
</script>
